server:
  # Render sets PORT; local/dev can use SERVER_PORT
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: monthly-budget-api
  datasource:
    # Override on Render with SPRING_DATASOURCE_* env vars
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-cool-river-bed2ay6c-pooler.c-9.us-east-2.aws.neon.tech:5432/neondb?sslmode=require&prepareThreshold=0}
    username: ${SPRING_DATASOURCE_USERNAME:neondb_owner}
    password: ${SPRING_DATASOURCE_PASSWORD:npg_sqQR2alwYy9i}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    show-sql: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:5174,https://prompt-sirocco-aabqv8p.tmp.now}

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    # Official UI path; also available via /docs and /swagger redirects
    path: /swagger-ui.html
    disable-swagger-default-url: true
    url: /v3/api-docs
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    filter: true
    display-request-duration: true
    doc-expansion: list
    use-root-path: false
  show-actuator: false
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  packages-to-scan: com.monthlybudget.controller



logging:
  level:
    com.monthlybudget: INFO
    org.hibernate.SQL: WARN
